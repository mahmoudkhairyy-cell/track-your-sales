name: Phase 1 verification

on:
  push:
    branches: [chatgpt/phase-1]
  pull_request:
    branches: [local-version]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline --progress=false --fetch-retries=2 --fetch-timeout=120000
      - run: npm run selfcheck
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
