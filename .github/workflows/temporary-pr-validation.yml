name: Temporary PR validation

on:
  push:
    branches:
      - fix/backup-validation-parity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run selfcheck
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
