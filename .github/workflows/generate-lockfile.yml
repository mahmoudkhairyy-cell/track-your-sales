name: Generate and verify dependency lockfile

on:
  push:
    branches:
      - chore/align-next-eslint-versions

permissions:
  contents: write

concurrency:
  group: track-your-sales-lockfile
  cancel-in-progress: true

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/align-next-eslint-versions
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund
      - run: npm run selfcheck
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate package lock"
            git push origin HEAD:chore/align-next-eslint-versions
          fi
      - name: Keep lockfile artifact as fallback
        uses: actions/upload-artifact@v4
        with:
          name: track-your-sales-package-lock
          path: package-lock.json
          if-no-files-found: error
