name: Backend unit tests

on:
  push:
    branches: [local-version]
    paths:
      - "ai-backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      # Verify the deployed endpoint with the approved GitHub Pages origin.
      - name: Live assistant API smoke test
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://track-your-sales-ai-service.vercel.app/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Origin": "https://mahmoudkhairyy-cell.github.io"
            },
            body: JSON.stringify({
              message: "عرّفني باختصار بتطبيق Track Your Sales",
              history: []
            }),
            signal: AbortSignal.timeout(45000)
          });
          const data = await response.json();
          if (!response.ok || data.ok !== true || typeof data.answer !== "string" || !data.answer.trim()) {
            console.error("Live assistant API smoke test failed:", response.status, data);
            process.exit(1);
          }
          console.log("Live assistant API smoke test passed; answer length:", data.answer.length);
          NODE
