name: Backend unit tests

on:
  push:
    branches: [local-version]
    paths:
      - "ai-backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      # Verify the deployed endpoint with the approved GitHub Pages origin.
      - name: Live assistant API smoke test
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://track-your-sales-ai-service.vercel.app/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Origin": "https://mahmoudkhairyy-cell.github.io"
            },
            body: JSON.stringify({
              message: "عرّفني باختصار بتطبيق Track Your Sales",
              history: []
            }),
            signal: AbortSignal.timeout(45000)
          });
          const data = await response.json();
          if (!response.ok || data.ok !== true || typeof data.answer !== "string" || !data.answer.trim()) {
            console.error("Live assistant API smoke test failed:", response.status, data);
            process.exit(1);
          }
          console.log("Live assistant API smoke test passed; answer length:", data.answer.length);
          const knowledgeResponse = await fetch("https://track-your-sales-ai-service.vercel.app/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Origin": "https://mahmoudkhairyy-cell.github.io"
            },
            body: JSON.stringify({
              message: "ما وظيفة SR 1104؟ وهل يحتوي على خطوات تنفيذ التحويل؟",
              history: []
            }),
            signal: AbortSignal.timeout(45000)
          });
          const knowledgeData = await knowledgeResponse.json();
          if (!knowledgeResponse.ok || knowledgeData.ok !== true || typeof knowledgeData.answer !== "string" || !knowledgeData.answer.trim()) {
            console.error("Knowledge-grounding smoke test failed:", knowledgeResponse.status, knowledgeData);
            process.exit(1);
          }
          console.log("Knowledge-grounding answer:", knowledgeData.answer);
          const migrationResponse = await fetch("https://track-your-sales-ai-service.vercel.app/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Origin": "https://mahmoudkhairyy-cell.github.io"
            },
            body: JSON.stringify({
              message: "عاوز أغير من فاتورة لكارت، أعملها إزاي؟ اشرحلي الخطوات بالتفصيل.",
              history: []
            }),
            signal: AbortSignal.timeout(45000)
          });
          const migrationData = await migrationResponse.json();
          if (!migrationResponse.ok || migrationData.ok !== true || typeof migrationData.answer !== "string" || !migrationData.answer.trim()) {
            console.error("Postpaid-to-prepaid migration test failed:", migrationResponse.status, migrationData);
            process.exit(1);
          }
          const forbidden = ["10758", "10707", "10704", "live capture", "control", "tariff lock", "wincash", "loyalty points", "نقاط الولاء", "تسوية الأقساط", "استرداد نقاط الولاء"];
          const leaked = forbidden.filter(term => migrationData.answer.toLowerCase().includes(term));
          if (leaked.length) {
            console.error("Migration answer contains unsupported procedure references:", leaked, migrationData.answer);
            process.exit(1);
          }
          console.log("Postpaid-to-prepaid answer:", migrationData.answer);
          NODE
